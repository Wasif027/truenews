name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: truenews
          POSTGRES_PASSWORD: truenews
          POSTGRES_DB: truenews
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U truenews"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ".[dev]"
      - run: ruff check .
      - run: pytest -q
        env:
          DATABASE_URL: postgresql+psycopg://truenews:truenews@localhost:5432/truenews
          RUN_EMBED_TESTS: "1" # real-embedding clustering (downloads a small model)
          RUN_DB_TESTS: "1" # full auth + like/save/history flow against Postgres

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
