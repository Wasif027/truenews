name: ingest

on:
  # Triggered by an external scheduler (cron-job.org) hitting the workflow
  # dispatch API, not GitHub's own `schedule:` — GitHub's scheduled runs are the
  # lowest-priority queue and were firing roughly 1 hour in 8 for this repo.
  workflow_dispatch:

concurrency:
  # One ingest cycle at a time. A second cron fire while one is still running
  # queues rather than piling a duplicate crawl on top.
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # 22 countries in one sequential job blew past the 50-min cap every run and
    # got cancelled, so only the first few ever refreshed. Now the countries are
    # split into shards that run in parallel — this repo is public, so GitHub
    # gives unlimited concurrent Actions minutes. India is heaviest, on its own.
    # Cut from 22 to 11 countries on 2026-09-13 (quality over quantity, less
    # load on the shared LLM quota and the database) — 4 shards is now plenty;
    # more would just mean more concurrent connections to Supabase for no gain.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        countries:
          - "in"
          - "bd,pk"
          - "uk,us"
          - "au,ie,sg,my,ca,jp"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install .
      - name: Run ingestion
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # LLM providers, tried in order. Set the ones you have as repo secrets;
          # with none set the offline heuristic is used. Each _BASE has a default.
          LLM_1_KEY: ${{ secrets.LLM_1_KEY }}
          LLM_1_BASE: ${{ vars.LLM_1_BASE || 'https://generativelanguage.googleapis.com/v1beta/openai' }}
          LLM_1_MODEL: ${{ vars.LLM_1_MODEL || 'gemini-3.5-flash,gemini-3.5-flash-lite' }}
          LLM_2_KEY: ${{ secrets.LLM_2_KEY }}
          LLM_2_BASE: ${{ vars.LLM_2_BASE || 'https://api.groq.com/openai/v1' }}
          LLM_2_MODEL: ${{ vars.LLM_2_MODEL || 'openai/gpt-oss-120b,qwen/qwen3.8-27b,openai/gpt-oss-20b' }}
          LLM_3_KEY: ${{ secrets.LLM_3_KEY }}
          LLM_3_BASE: ${{ vars.LLM_3_BASE }}
          LLM_3_MODEL: ${{ vars.LLM_3_MODEL }}
          COUNTRIES: ${{ matrix.countries }}
        run: python -m app.cli ingest
