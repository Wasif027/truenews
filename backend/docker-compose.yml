services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: truenews
      POSTGRES_PASSWORD: truenews
      POSTGRES_DB: truenews
    ports:
      - "5432:5432"
    volumes:
      - truenews_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truenews"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  truenews_pgdata:
