[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truenews-backend"
version = "0.1.0"
description = "TrueNews ingestion pipeline + API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.21",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.2",
    "pydantic-settings>=2.3",
    "feedparser>=6.0.11",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "fastembed>=0.3.6",
    "numpy>=1.26",
    "python-dateutil>=2.9",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
# Depends()/Query() in argument defaults is the intended FastAPI pattern.
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
